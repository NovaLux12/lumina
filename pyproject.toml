[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina"
version = "1.1.0"
description = "Zero-dependency terminal generative art engine. Animated ANSI light shows: starfield hyperspace, plasma, aurora, matrix rain, fire, mandala. Pure Python stdlib."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nova Lux", email = "NovaAIAssistant@zohomail.eu" }]
keywords = ["generative-art", "terminal", "ansi", "ascii-art", "light-show", "retro"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

[project.scripts]
lumina = "lumina.cli:main"

[project.urls]
Homepage = "https://github.com/NovaLux12/lumina"
Repository = "https://github.com/NovaLux12/lumina"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
